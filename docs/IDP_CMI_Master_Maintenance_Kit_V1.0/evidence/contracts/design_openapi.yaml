openapi: 3.1.0
info:
  title: IDP CMI Core API
  version: 1.0.0-draft
  description: Contract-first API specification. Canonical record schemas describe
    server-owned resource representations; public write requests use separate strict
    allowlist schemas. All tenant/principal/authority fields are server-enforced.
servers:
- url: https://cmi.example.invalid
security:
- bearerAuth: []
paths:
  /cmi/v1/sources/ingest:
    post:
      summary: Create or acknowledge immutable SourceRecord
      operationId: post_cmi_v1_sources_ingest
      responses:
        '201':
          description: Create or acknowledge immutable SourceRecord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/source_record'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '202':
          description: Ingestion accepted for asynchronous processing; not yet committed
            to Memory Registry
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceIngestRequest'
  /cmi/v1/memories/propose:
    post:
      summary: Propose candidate MemoryRecord
      operationId: post_cmi_v1_memories_propose
      responses:
        '201':
          description: Propose candidate MemoryRecord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/memory_record'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryProposeRequest'
  /cmi/v1/memories/search:
    post:
      summary: Authorized scoped and bitemporal memory search
      operationId: post_cmi_v1_memories_search
      responses:
        '200':
          description: Authorized scoped and bitemporal memory search
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
  /cmi/v1/memories/{id}:
    get:
      summary: Read authorized MemoryRecord
      operationId: get_cmi_v1_memories_id
      responses:
        '200':
          description: Read authorized MemoryRecord
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/memory_record'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      parameters: &id001
      - in: path
        name: id
        required: true
        schema:
          type: string
  /cmi/v1/memories/{id}/transitions:
    post:
      summary: CAS-based lifecycle transition
      operationId: post_cmi_v1_memories_id_transitions
      responses:
        '200':
          description: CAS-based lifecycle transition
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '412':
          description: Expected revision did not match
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/lifecycle_transition'
      parameters: *id001
  /cmi/v1/contexts/compile:
    post:
      summary: Compile authorized context into ContextBundle
      operationId: post_cmi_v1_contexts_compile
      responses:
        '201':
          description: Compile authorized context into ContextBundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/context_bundle'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextCompileRequest'
  /cmi/v1/contexts/{id}:
    get:
      summary: Read authorized ContextBundle
      operationId: get_cmi_v1_contexts_id
      responses:
        '200':
          description: Read authorized ContextBundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/context_bundle'
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      parameters: *id001
  /cmi/v1/contexts/{id}/validate:
    post:
      summary: Revalidate ContextBundle against current authorization
      operationId: post_cmi_v1_contexts_id_validate
      responses:
        '200':
          description: Revalidate ContextBundle against current authorization
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      parameters: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleValidationRequest'
  /cmi/v1/privacy/erasure-requests:
    post:
      summary: Request governed erase workflow
      operationId: post_cmi_v1_privacy_erasure_requests
      responses:
        '202':
          description: Request governed erase workflow
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequest'
  /cmi/v1/operations/{id}:
    get:
      summary: Read async operation status
      operationId: get_cmi_v1_operations_id
      responses:
        '200':
          description: Read async operation status
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
      parameters: *id001
  /cmi/v1/health/live:
    get:
      summary: Liveness probe
      operationId: get_cmi_v1_health_live
      responses:
        '200':
          description: Liveness probe
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
  /cmi/v1/health/ready:
    get:
      summary: Readiness probe
      operationId: get_cmi_v1_health_ready
      responses:
        '200':
          description: Readiness probe
        '400':
          description: Validation error
        '401':
          description: Missing or invalid credentials
        '403':
          description: Denied resource or purpose
        '409':
          description: Conflict or projection lag
        '503':
          description: Dependency unavailable
        '429':
          description: Rate limited
      tags:
      - CMI core
components:
  schemas:
    source_record:
      $ref: ./schemas/source-record.schema.json
    memory_record:
      $ref: ./schemas/memory-record.schema.json
    context_bundle:
      $ref: ./schemas/context-bundle.schema.json
    lifecycle_transition:
      $ref: ./schemas/lifecycle-transition.schema.json
    authorization_context:
      $ref: ./schemas/authorization-context.schema.json
    erasure_tombstone:
      $ref: ./schemas/erasure-tombstone.schema.json
    SourceIngestRequest:
      type: object
      additionalProperties: false
      properties:
        source_system:
          type: string
          minLength: 1
        source_object_key:
          type: string
          minLength: 1
        source_revision:
          type: integer
          minimum: 1
        source_type:
          type: string
          enum:
          - event
          - document
          - conversation
          - api_snapshot
          - human_attestation
        captured_at:
          type: string
          format: date-time
        content_hash:
          type: string
          pattern: ^sha256:[a-fA-F0-9]{64}$
        content_location:
          type: string
          minLength: 1
        client_request_ref:
          type: string
          minLength: 1
      required:
      - source_system
      - source_object_key
      - source_revision
      - source_type
      - captured_at
      - content_hash
      - content_location
    MemoryProposeRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
              minLength: 1
          additionalProperties: false
          required:
          - type
          - id
        subject_ref:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
          - working
          - episodic
          - semantic
          - procedural
          - preference
        claim_text:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
        source_refs:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              source_id:
                type: string
                minLength: 1
              source_revision:
                type: integer
                minimum: 1
            required:
            - source_id
            - source_revision
            additionalProperties: false
      required:
      - scope
      - subject_ref
      - kind
      - claim_text
      - language
      - source_refs
    MemorySearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
        scope:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
          required:
          - type
          - id
        purpose:
          type: string
          minLength: 1
        top_k:
          type: integer
          minimum: 1
          maximum: 100
        as_of_valid:
          type:
          - string
          - 'null'
          format: date-time
        known_at:
          type:
          - string
          - 'null'
          format: date-time
        min_projection_watermark:
          type:
          - string
          - 'null'
        consistency:
          type: string
          enum:
          - eventual
          - at_least_watermark
      required:
      - query
      - scope
      - purpose
    ContextCompileRequest:
      type: object
      additionalProperties: false
      properties:
        task_ref:
          type: string
          minLength: 1
        question:
          type: string
          minLength: 1
        scope:
          type: object
          additionalProperties: false
          properties:
            type:
              type: string
              minLength: 1
            id:
              type: string
              minLength: 1
          required:
          - type
          - id
        purpose:
          type: string
          minLength: 1
        model_profile:
          type: object
          additionalProperties: false
          properties:
            model_id:
              type: string
              minLength: 1
            tokenizer_id:
              type: string
              minLength: 1
            tokenizer_version:
              type: string
              minLength: 1
          required:
          - model_id
          - tokenizer_id
          - tokenizer_version
        hard_limit_tokens:
          type: integer
          minimum: 1
        reserved_output_tokens:
          type: integer
          minimum: 0
        min_projection_watermark:
          type:
          - string
          - 'null'
      required:
      - task_ref
      - question
      - scope
      - purpose
      - model_profile
      - hard_limit_tokens
      - reserved_output_tokens
    ErasureRequest:
      type: object
      additionalProperties: false
      properties:
        target_type:
          type: string
          enum:
          - source
          - memory
          - bundle
        target_id:
          type: string
          minLength: 1
        reason_code:
          type: string
          minLength: 1
        approval_ref:
          type:
          - string
          - 'null'
      required:
      - target_type
      - target_id
      - reason_code
    BundleValidationRequest:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          minLength: 1
        task_ref:
          type: string
          minLength: 1
      required:
      - purpose
      - task_ref
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            request_id:
              type: string
              minLength: 1
            retryable:
              type: boolean
          required:
          - code
          - message
          - request_id
          - retryable
      required:
      - error
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
