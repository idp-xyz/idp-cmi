openapi: 3.1.0
info:
  title: IDP CMI API
  version: 1.1.0
  description: |
    Context, Memory & Knowledge Infrastructure (docs/adr/ADR-0001-cmi-design.md). Three surfaces on one
    listener: the administrative API (`/api/v1`, role cmi-admin) for sources, knowledge documents and the
    tenant policy; the memory API (`/v1/memory`, role cmi-writer) for appending and revoking records; and
    the context API (`/v1/context`, role cmi-reader) that resolves a sealed, content-addressed
    ContextPackage and reads packages back with their staleness. Every request carries an OAuth bearer
    token; objects are isolated per tenant by the database's row-level security.
    internal/api/openapi_test.go keeps the paths in step with the router.
servers:
  - url: http://127.0.0.1:8550
security:
  - bearerAuth: []
paths:
  /healthz:
    get: {summary: Liveness, security: [], responses: {'200': {description: alive}}}
  /readyz:
    get: {summary: Readiness (database reachable), security: [], responses: {'200': {description: ready}, '503': {description: not ready}}}
  /version:
    get: {summary: Service and version, security: [], responses: {'200': {description: version}}}
  /api/v1/sources:
    post:
      summary: Register a source (ADR-0001 D2); agent and user sources are informational
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
      responses: {'201': {description: created, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get:
      summary: List the tenant's sources (any role)
      responses: {'200': {description: sources}}
  /api/v1/sources/{ref}:
    parameters: [{$ref: '#/components/parameters/ref'}]
    get: {summary: Get a source by id or name, responses: {'200': {description: source}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/knowledge/documents:
    post:
      summary: Index a knowledge document (ADR-0001 D4); a new version of the same uri supersedes the active one. Idempotency-Key (D19) makes retries safe
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Document'}, {type: object, required: [text], properties: {text: {type: string}}}]}}}}
      responses: {'201': {description: indexed, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get: {summary: List documents (newest first), responses: {'200': {description: documents}}}
  /api/v1/knowledge/documents/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get: {summary: Get a document's metadata, responses: {'200': {description: document}, '404': {$ref: '#/components/responses/Problem'}}}
    delete:
      summary: Revoke a document (ADR-0001 D6); it leaves retrieval and packages citing it read as stale. If-Match (D19) names the expected revision
      parameters: [{name: reason, in: query, schema: {type: string}}, {$ref: '#/components/parameters/ifMatch'}]
      responses: {'200': {description: revoked}, '404': {$ref: '#/components/responses/Problem'}}
  /api/v1/policy:
    get: {summary: The tenant's policy (sensitivity ceilings per role, default memory TTL, package TTL), responses: {'200': {description: policy, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}}}
    put:
      summary: Set the tenant's policy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
      responses: {'200': {description: policy}, '422': {$ref: '#/components/responses/Problem'}}
  /api/v1/audit:
    get:
      summary: Recent administrative actions
      parameters: [{name: limit, in: query, schema: {type: integer}}]
      responses: {'200': {description: audit events}}
  /api/v1/memory/consolidate:
    post:
      summary: Distill the tenant's unconsolidated episodic memory into semantic statements now (ADR-0001 D15); optional scope narrows it; 503 without a consolidation model
      requestBody: {required: false, content: {application/json: {schema: {type: object, properties: {scope: {type: object, properties: {kind: {type: string}, id: {type: string}}}}}}}}
      responses: {'200': {description: 'summary: groups, completed, rejected, failed, created'}, '409': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/Problem'}}
  /api/v1/memory/consolidations:
    get: {summary: Recorded consolidations (inputs, outputs, model, status, dropped statements), responses: {'200': {description: consolidations}}}
  /api/v1/connectors:
    post:
      summary: Register a connector on a document-store source (ADR-0001 D16)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Connector'}}}}
      responses: {'201': {description: created}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get: {summary: List connectors, responses: {'200': {description: connectors}}}
  /api/v1/connectors/{ref}:
    parameters: [{$ref: '#/components/parameters/ref'}]
    get: {summary: Get a connector by id or name, responses: {'200': {description: connector}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/connectors/{ref}/sync:
    parameters: [{$ref: '#/components/parameters/ref'}]
    post:
      summary: Enumerate the connector's documents now and queue one ingestion job per document; the worker fetches, converts and indexes them (unchanged content is skipped)
      responses: {'200': {description: how many jobs were queued}, '502': {$ref: '#/components/responses/Problem'}}
  /api/v1/connectors/{ref}/jobs:
    parameters: [{$ref: '#/components/parameters/ref'}]
    get: {summary: The connector's ingestion jobs (newest first), parameters: [{name: limit, in: query, schema: {type: integer}}], responses: {'200': {description: jobs}}}
  /api/v1/units:
    put:
      summary: Register or replace a unit of the directory (ADR-0001 D22) - an organization, team or project with its members and roles; membership decides who reads and writes the unit's memory
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Unit'}}}}
      responses: {'200': {description: unit}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get: {summary: The directory, responses: {'200': {description: units}}}
  /api/v1/units/{kind}/{id}:
    parameters: [{name: kind, in: path, required: true, schema: {type: string, enum: [organization, team, project]}}, {$ref: '#/components/parameters/id'}]
    delete: {summary: Remove a unit (its memory stays, unreachable until re-registered), responses: {'204': {description: removed}, '404': {$ref: '#/components/responses/Problem'}}}
  /v1/units:
    get: {summary: The units the caller belongs to (the scopes a resolve adds by default), responses: {'200': {description: units}}}
  /v1/memory/records/{id}/share:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: Share a record into a unit explicitly (ADR-0001 D22) - the record's subject or an administrator, who must belong to the unit; a copy with sharedFrom is created, the original is untouched
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [scope], properties: {scope: {type: object, properties: {kind: {type: string, enum: [organization, team, project]}, id: {type: string}}}, reason: {type: string}}}}}}
      responses: {'201': {description: the shared copy}, '403': {$ref: '#/components/responses/Problem'}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}}
  /api/v1/projections:
    get: {summary: 'The tenant''s vector projection backlog (ADR-0001 D26): pending outbox events by kind, the age of the oldest, the embedding model; packages carry the lag as projectionLag', responses: {'200': {description: backlog}}}
  /api/v1/erasures:
    post:
      summary: Request an erasure (ADR-0001 D20) by record ids, document ids, provenance ref, subject scope or entity; the read barrier takes effect in this call, the purge of each domain (content, vectors, index, entities, packages, audit) follows asynchronously
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {recordIds: {type: array, items: {type: string}}, documentIds: {type: array, items: {type: string}}, ref: {type: string}, subject: {type: string}, entity: {$ref: '#/components/schemas/Entity'}, reason: {type: string}}}}}}
      responses: {'201': {description: 'erasure: targets caught by the barrier, per-domain status (pending until the Worker runs)'}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get: {summary: Erasures (newest first), responses: {'200': {description: erasures}}}
  /api/v1/erasures/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get: {summary: 'One erasure: status pending | running | verified | failed and each domain''s rows, time and error; verified only when every domain is done', responses: {'200': {description: erasure}, '404': {$ref: '#/components/responses/Problem'}}}
  /api/v1/evaluations:
    post:
      summary: Run the governance suite on this tenant's real data path and store the evidence (ADR-0001 D17) - pollution, source priority, revocation propagation, freshness, sensitivity and ACL
      responses: {'201': {description: 'evaluation: status PASSED | FAILED and checks'}}
    get: {summary: Past evaluations (newest first), responses: {'200': {description: evaluations}}}
  /api/v1/evaluations/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get: {summary: One evaluation with its evidence, responses: {'200': {description: evaluation}, '404': {$ref: '#/components/responses/Problem'}}}
  /v1/memory/facts:
    post:
      summary: 'Write a FACT (ADR-0001 D41): a memory record with a key and a value, of which one is current per (scope, key). A new value closes the validity of the current one (valid_until = the new valid_from) and inserts the new record in the same transaction; the same value again is "unchanged" (200, nothing written); a statement older than the current value is 409. Body: key (a-z0-9._-), value (1-500 chars), plus the record fields (scope, content, provenance, sensitivity, ...); no validUntil. Role cmi-writer; the same checks, quotas and idempotency as POST /v1/memory/records.'
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      responses: {'201': {description: 'created or updated: {outcome, record, closed}'}, '200': {description: unchanged}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/Problem'}}
  /v1/memory/export:
    get:
      summary: 'The caller''s own memory as a file (ADR-0001 D34): the records the CMI holds as live about their subject, envelope idp-cmi.memory-export.v1, Content-Disposition attachment; truncated is true when more than 500 records exist. Roles cmi-reader or cmi-writer; nobody else''s records are ever included.'
      responses: {'200': {description: the export}, '403': {$ref: '#/components/responses/Problem'}}
  /v1/memory/records:
    post:
      summary: 'Append a memory record (ADR-0001 D3); provenance and a registered source are required, the writer''s ceiling bounds the sensitivity. status may be candidate (D21). structured.contradicts (record ids, authoritative sources only) disputes those records. Idempotency-Key (D19) makes retries safe
      parameters: [{$ref: '#/components/parameters/idempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryRecord'}}}}
      responses: {'201': {description: recorded, content: {application/json: {schema: {$ref: '#/components/schemas/MemoryRecord'}}}}, '403': {$ref: '#/components/responses/Problem'}, '429': {description: 'RATE_LIMITED (Retry-After seconds) or QUOTA_EXCEEDED: the writer, scope or tenant is over its configured limit (ADR-0001 D34)', content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
    get:
      summary: List the usable records of a scope the caller may see (default scope = the caller's subject); flagged=true (administrators) lists the quarantine (ADR-0001 D12), status=candidate|disputed (administrators) the review queue (D21), across scopes unless one is given
      parameters: [{name: scopeKind, in: query, schema: {type: string, enum: [tenant, subject, thread, agent, organization, team, project]}}, {name: scopeId, in: query, schema: {type: string}}, {name: limit, in: query, schema: {type: integer}}, {name: flagged, in: query, schema: {type: boolean}}, {name: status, in: query, schema: {type: string, enum: [candidate, disputed]}}, {name: validAt, in: query, schema: {type: string, format: date-time}, description: 'bitemporal view (ADR-0001 D25): business time the records must be valid at'}, {name: recordedAt, in: query, schema: {type: string, format: date-time}, description: 'registration time by which the CMI must have known (and not revoked) the records'}]
      responses: {'200': {description: records}}
  /v1/memory/records/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get: {summary: Get a record the caller may see (any status), responses: {'200': {description: record}, '404': {$ref: '#/components/responses/Problem'}}}
  /v1/memory/records/{id}/transitions:
    parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/ifMatch'}]
    post:
      summary: 'Move a record between statuses by decision (ADR-0001 D21): candidate -> active | revoked, active -> disputed | revoked, disputed -> active | revoked; administrators; reason required, approvalRef optional unless the tenant policy requires one to admit a candidate; with authorization.approvals configured the approval system confirms the reference for this record and transition (409 APPROVAL_INVALID, 503 APPROVAL_UNAVAILABLE); approver and validity are recorded in the audit (approvalVerified) (D30)'
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [to, reason], properties: {to: {type: string, enum: [active, disputed, revoked]}, reason: {type: string}, approvalRef: {type: string}}}}}}
      responses: {'200': {description: the record after the transition}, '404': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/memory/revoke:
    post:
      summary: Revoke records by id or by provenance reference (ADR-0001 D6); a writer revokes what it recorded, an administrator anything; a reader (cmi-reader) may revoke records of their OWN subject scope, one recordId at a time, whoever wrote them (D26). If-Match (D19) names the expected version of the single record
      parameters: [{$ref: '#/components/parameters/ifMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {recordId: {type: string}, ref: {type: string}, reason: {type: string}}}}}}
      responses: {'200': {description: how many records were revoked}, '404': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/entities/{type}/{id}:
    parameters: [{name: type, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/id'}]
    get:
      summary: The usable records and documents the caller may see that reference this business object (ADR-0001 D13)
      parameters: [{name: limit, in: query, schema: {type: integer}}]
      responses: {'200': {description: entity, records, documents}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/context/resolve:
    post:
      summary: Assemble, seal and store a ContextPackage for the caller (ADR-0001 D5)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResolveRequest'}}}}
      responses: {'200': {description: 'the package (contract idp.telos.cmi ContextPackage) with its id and digest; package.omitted counts what matched but was not packed (budget, flagged, candidate, disputed, forbidden, lowSimilarity; ADR-0001 D28)'}, '422': {$ref: '#/components/responses/Problem'}}
  /v1/context/packages/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Read a package back (its requester or an administrator); stale lists the cited items that have since expired, been revoked or superseded
      responses: {'200': {description: 'package, digest, stale, staleItems, expiresAt, redacted (true when erased items'' plaintext was removed from the stored document; the digest is of the sealed original)'}, '404': {$ref: '#/components/responses/Problem'}}
  /v1/context/packages/{id}/verify:
    parameters: [{$ref: '#/components/parameters/id'}]
    post:
      summary: 'Verify a package at delivery time (ADR-0001 D24): stale and staleItems as in the read-back, plus every cited item''s current status, version and usability; the package''s validity is not extended. Contract idp.telos.cmi Verification'
      responses: {'200': {description: verification}, '404': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    idempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,128}$'}, description: 'the same key with the same request replays the first answer (200, Idempotent-Replayed: true); with another request it is a 409 (ADR-0001 D19). Keys are kept 24 hours'}
    ifMatch: {name: If-Match, in: header, schema: {type: integer, minimum: 1}, description: 'the version (records) or revision (documents) the caller expects; 409 when it moved (ADR-0001 D19)'}
    ref: {name: ref, in: path, required: true, schema: {type: string}, description: id or name}
    id: {name: id, in: path, required: true, schema: {type: string}}
  responses:
    Problem:
      description: error
      content: {application/json: {schema: {type: object, properties: {error: {type: object, properties: {code: {type: string}, message: {type: string}}}}}}}
  schemas:
    Source:
      type: object
      required: [name, displayName, kind, trust]
      properties: {sourceId: {type: string}, name: {type: string}, displayName: {type: string}, kind: {type: string, enum: [domain-system, document-store, agent, user]}, trust: {type: string, enum: [authoritative, informational]}, baseUrl: {type: string}, createdBy: {type: string}, createdAt: {type: string, format: date-time}}
    MemoryRecord:
      description: contract idp.telos.cmi MemoryRecord
      type: object
      required: [scope, kind, content, provenance, sensitivity]
      properties:
        recordId: {type: string}
        scope: {type: object, required: [kind], properties: {kind: {type: string, enum: [tenant, subject, thread, agent, organization, team, project]}, id: {type: string}}}
        kind: {type: string, enum: [episodic, semantic]}
        content: {type: string}
        structured: {type: object}
        tags: {type: array, items: {type: string}}
        provenance: {type: object, required: [source, ref, observedAt], properties: {source: {type: string}, ref: {type: string}, observedAt: {type: string, format: date-time}, recordedBy: {type: string}}}
        validity: {type: object, properties: {validFrom: {type: string, format: date-time}, validUntil: {type: string, format: date-time}}}
        status: {type: string, enum: [candidate, active, disputed, expired, revoked]}
        disputedBy: {type: string, readOnly: true, description: the record that contradicts this one (ADR-0001 D21)}
        sharedFrom: {type: string, readOnly: true, description: the record this one was shared from (ADR-0001 D22)}
        revocation: {type: object, properties: {at: {type: string, format: date-time}, by: {type: string}, reason: {type: string}}}
        sensitivity: {type: string, enum: [public, internal, confidential, restricted]}
        acl: {type: object, description: 'who may read the record besides the tenant ceiling: empty = everyone who may name the scope. A thread-scoped record written without one gets {subjects: [the writer], roles: [cmi-admin]} (ADR-0001 D44); a writer that wants others to read the thread names them', properties: {subjects: {type: array, items: {type: string}}, roles: {type: array, items: {type: string}}}}
        entities: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Entity'}, description: business objects the record refers to (ADR-0001 D13)}
        flags: {type: array, items: {type: string}, readOnly: true, description: 'write-time scan findings (ADR-0001 D12), e.g. injection:instruction_override; flagged records stay out of packages unless the policy includes them'}
        version: {type: integer, readOnly: true, description: bumped by every state change (ADR-0001 D19)}
        createdAt: {type: string, format: date-time}
    Unit:
      type: object
      required: [kind, id, displayName]
      properties: {kind: {type: string, enum: [organization, team, project]}, id: {type: string}, displayName: {type: string}, parent: {type: object, properties: {kind: {type: string}, id: {type: string}}}, members: {type: array, items: {type: string}}, roles: {type: array, items: {type: string}}, updatedBy: {type: string}, updatedAt: {type: string, format: date-time}}
    Entity:
      type: object
      required: [type, id]
      properties: {type: {type: string, pattern: '^[a-z][a-z0-9-]{0,62}$'}, id: {type: string}}
    Document:
      description: contract idp.telos.cmi KnowledgeDocument (metadata; the text is indexed, not returned)
      type: object
      required: [source, uri, title, sensitivity]
      properties: {documentId: {type: string}, source: {type: string}, uri: {type: string}, title: {type: string}, version: {type: integer}, contentSha256: {type: string}, byteSize: {type: integer}, chunkCount: {type: integer}, status: {type: string, enum: [active, superseded, revoked, expired]}, validUntil: {type: string, format: date-time}, sensitivity: {type: string, enum: [public, internal, confidential, restricted]}, acl: {type: object}, revocation: {type: object}, createdBy: {type: string}, createdAt: {type: string, format: date-time}, entities: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Entity'}}, flags: {type: array, items: {type: string}, readOnly: true}, revision: {type: integer, readOnly: true}}
    Connector:
      type: object
      required: [source, name, kind, config]
      properties:
        connectorId: {type: string}
        source: {type: string, description: a document-store source}
        name: {type: string}
        kind: {type: string, enum: [http-manifest, filesystem]}
        config: {type: object, properties: {url: {type: string, description: 'http-manifest: a JSON list of {uri, url, title, sensitivity?, acl?, entities?}'}, baseUrl: {type: string, description: 'http-manifest: only urls under it are fetched'}, path: {type: string, description: 'filesystem: an absolute directory on the CMI host (development)'}, sensitivity: {type: string}, acl: {type: object}, headers: {type: array, items: {type: string}, description: '"Name: value"; no credentials (ADR-0001 D45): Authorization, Cookie, X-Api-Key and other names or values that carry one are refused (422)'}}}
        scheduleSeconds: {type: integer, description: 0 = manual sync only; otherwise at least 60}
        lastSyncAt: {type: string, format: date-time}
        createdBy: {type: string}
        createdAt: {type: string, format: date-time}
    Policy:
      type: object
      properties: {readerCeiling: {type: string}, writerCeiling: {type: string}, defaultMemoryTtlDays: {type: integer}, packageTtlSeconds: {type: integer}, includeFlagged: {type: boolean, description: 'let flagged content into packages, items then carry flags (ADR-0001 D12); default false'}, consolidateMinRecords: {type: integer, description: 'episodic records a group needs before it is distilled (D15, default 5)'}, consolidatedTtlDays: {type: integer, description: 'validity of distilled statements (D15, default 90)'}, consolidatedAsCandidate: {type: boolean, description: 'distilled statements are written as candidates for an administrator to admit (D21)'}, requireApproval: {type: boolean, description: 'admitting a candidate (candidate -> active) needs an approvalRef (D30)'}, externalModelCeiling: {type: string, enum: [public, internal, confidential, restricted], description: 'content above this level is never sent to an external model: no vectors, no consolidation (D29); default internal. Lowering it removes existing vectors above it'}, updatedBy: {type: string}, updatedAt: {type: string, format: date-time}, default: {type: boolean}}
    ResolveRequest:
      type: object
      required: [query]
      properties:
        query: {type: string}
        purpose: {type: string}
        scope: {type: object, properties: {kind: {type: string, enum: [tenant, subject, thread, agent, organization, team, project]}, id: {type: string}}}
        scopes: {type: array, maxItems: 32, items: {type: object, properties: {kind: {type: string}, id: {type: string}}}, description: 'more scopes (ADR-0001 D22); the caller''s own units are always included, a unit the caller does not belong to is a 403'}
        asOf: {type: object, properties: {valid: {type: string, format: date-time}, recorded: {type: string, format: date-time}}, description: 'bitemporal view (ADR-0001 D25): resolve what was valid at valid and known by recorded (a missing axis = now); recorded in the package'}
        budget: {type: object, properties: {maxTokens: {type: integer, description: default 2000, at most 32000}, maxItems: {type: integer, description: default 20, at most 100}}}
        sources: {type: array, items: {type: string}}
        kinds: {type: array, items: {type: string, enum: [memory, knowledge]}}
        maxAgeDays: {type: integer}
        sensitivityCeiling: {type: string, enum: [public, internal, confidential, restricted], description: may only lower the caller's ceiling}
        entities: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/Entity'}, description: only content referencing one of these business objects (ADR-0001 D13)}
