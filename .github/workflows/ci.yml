name: CI

# The merge gate of idp-cmi: formatting and vet, unit and contract tests (race detector on), the
# integration suite against a throwaway PostgreSQL (the Makefile starts it in Docker), and the
# offline image build, and the compose end-to-end of the CMI alone (deploy/e2e.sh). The joint run
# with the idp-host image (HOST=1) needs that image built from the idp-host repository and is not run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit, contract, integration, image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Third-party images are named by the mirror (platform releases/mirror-images.yaml), not by their source
        run: |
          if git grep -nE '(public\.ecr\.aws|quay\.io|docker\.io)/|ghcr\.io/(aquasecurity|cloudnative-pg|huggingface)/' -- . ':!*.md' ':!*.sum' | grep -v 'mirror:upstream'; then
            echo "an image is named by its source: use ghcr.io/idp-xyz/mirror:<tag> (python3 tools/mirror_images.py plan, in the platform repository)" >&2; exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, vet, unit and contract tests
        run: make test
      - name: Known vulnerabilities in the dependencies and the standard library (govulncheck)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Integration tests (PostgreSQL in Docker)
        run: make test-integration
      - name: Integration tests on PostgreSQL with pgvector (the native semantic path and the HNSW index)
        run: make test-integration-pgvector
      - name: Retrieval evaluation against the committed results (PostgreSQL in Docker)
        run: make test-eval
      - name: Image build (static binary, docker build --network none)
        run: bash deploy/build.sh idp-cmi:ci
      - name: Image vulnerabilities (trivy, HIGH and CRITICAL with a fix fail the build)
        run: |
          bash deploy/pull-image.sh ghcr.io/idp-xyz/mirror:ghcr.io__aquasecurity__trivy__0.76.2
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/idp-xyz/mirror:ghcr.io__aquasecurity__trivy__0.76.2 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 idp-cmi:ci
      - name: Compose end-to-end (CMI image + PostgreSQL)
        run: bash deploy/e2e.sh

