name: CI

# The merge gate of idp-cmi: formatting and vet, unit and contract tests (race detector on), the
# integration suite against a throwaway PostgreSQL (the Makefile starts it in Docker), and the
# offline image build, and the compose end-to-end of the CMI alone (deploy/e2e.sh). The joint run
# with the idp-host image (HOST=1) needs that image built from the idp-host repository and is not run here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, unit, contract, integration, image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, vet, unit and contract tests
        run: make test
      - name: Integration tests (PostgreSQL in Docker)
        run: make test-integration
      - name: Integration tests on PostgreSQL with pgvector (the native semantic path and the HNSW index)
        run: make test-integration-pgvector
      - name: Retrieval evaluation against the committed results (PostgreSQL in Docker)
        run: make test-eval
      - name: Image build (static binary, docker build --network none)
        run: bash deploy/build.sh idp-cmi:ci
      - name: Compose end-to-end (CMI image + PostgreSQL)
        run: bash deploy/e2e.sh

