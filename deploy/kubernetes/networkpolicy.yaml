# Default deny, then exactly what the CMI needs. PostgreSQL, the IdP and the model endpoints are
# outside the cluster here (ipBlock placeholders); replace them with your addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: idp-cmi
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: idp-cmi
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# cmi: ingress on the API port from the HOST and EER namespaces and the ingress controller, metrics
# from the monitoring namespace; egress to PostgreSQL, the IdP (JWKS) and the model endpoints
# (embeddings, consolidation).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cmi
  namespace: idp-cmi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: cmi
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-host
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: idp-eer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - {protocol: TCP, port: 8550}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 9565}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32       # the IdP (JWKS)
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 203.0.113.20/32       # model endpoints (embeddings, consolidation)
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 4318}   # OTLP/HTTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
  namespace: idp-cmi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migrate
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - {protocol: TCP, port: 5432}
