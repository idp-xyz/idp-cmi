# The Secrets the manifests reference, with placeholder values. NOT part of kustomization.yaml:
# create them with your secret management (External Secrets, Sealed Secrets, cert-manager, ...).
# tests/deploy checks that every secretKeyRef / secret volume in the manifests names a Secret and
# key listed here.
apiVersion: v1
kind: Secret
metadata:
  name: idp-cmi-db
  namespace: idp-cmi
stringData:
  owner-url: postgres://idp_cmi_owner:CHANGE-ME@postgres.databases.svc.cluster.local:5432/idp_cmi?sslmode=verify-full
  service-url: postgres://idp_cmi_svc:CHANGE-ME@postgres.databases.svc.cluster.local:5432/idp_cmi?sslmode=verify-full
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-cmi-tls                  # server certificate of the CMI API (cert-manager Certificate recommended)
  namespace: idp-cmi
type: kubernetes.io/tls
stringData:
  tls.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
  tls.key: "-----BEGIN PRIVATE KEY-----\nCHANGE-ME\n-----END PRIVATE KEY-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-cmi-identity-ca          # CA of the IdP (JWKS), if not publicly trusted
  namespace: idp-cmi
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-cmi-model-keys           # one file per model endpoint, named as cmi.yaml's apiKeyFile refers to it
  namespace: idp-cmi
stringData:
  embedding: CHANGE-ME
  consolidation: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: idp-cmi-model-ca             # CA of the model endpoints' server certificates (optional)
  namespace: idp-cmi
stringData:
  ca.crt: "-----BEGIN CERTIFICATE-----\nCHANGE-ME\n-----END CERTIFICATE-----"
