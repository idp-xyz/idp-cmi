# Schema migrations, run as the schema owner before a new image version is rolled out.
apiVersion: batch/v1
kind: Job
metadata:
  name: idp-cmi-migrate
  namespace: idp-cmi
  labels:
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: idp-cmi
          command: ["/usr/local/bin/idp-cmi", "migrate"]
          env:
            - name: IDP_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: idp-cmi-db
                  key: owner-url
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
